name: Sprawdź i opublikuj podgląd

on:
  push:
    branches:
      - main
      - codex/tacho-panel
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: super-spedytor-kierowca-preview
  cancel-in-progress: true

jobs:
  build:
    name: Kontrola i przygotowanie podglądu
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Pobierz źródła
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Sprawdź pliki prototypu
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/driver.css
          test -f dist/flow.css
          test -f dist/demo-assets.js
          test -f dist/break-suggestion.js
          test -f dist/operation-timing.js
          test -f dist/vehicle-handover.js
          test -f dist/flow.js
          node --check dist/demo-assets.js
          node --check dist/break-suggestion.js
          node --check dist/operation-timing.js
          node --check dist/vehicle-handover.js
          node --check dist/flow.js
          node --check dist/tacho.js
          node --test tests/*.test.cjs

      - name: Przygotuj paczkę GitHub Pages
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/
          retention-days: 1

  deploy:
    name: Publikacja GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Opublikuj podgląd
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
